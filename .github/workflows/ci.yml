name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r --if-present run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build frontend
        env:
          PORT: 5173
          BASE_PATH: /
          VITE_API_BASE_URL: ""
        run: pnpm --filter @workspace/escala-generator run build

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build
