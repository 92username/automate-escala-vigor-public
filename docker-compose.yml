services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${FRONTEND_BUILD_PORT:-5173}
        BASE_PATH: ${BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - "${HTPASSWD_PATH:-/opt/escala-generator/.htpasswd}:/etc/nginx/.htpasswd:ro"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - escala-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPERATIONAL_SCHEDULE_SOURCE_PATH: ${OPERATIONAL_SCHEDULE_SOURCE_PATH:-/opt/escala-generator/data/Escala_em_Vigor.xlsx}
    volumes:
      - "/opt/escala-generator/data:/opt/escala-generator/data:ro"
    expose:
      - "3000"
    networks:
      - escala-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  escala-internal:
    driver: bridge
