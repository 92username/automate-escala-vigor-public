kind = "web"
previewPath = "/"
title = "Gerador de Escala Mensal"
version = "1.0.0"
id = "artifacts/escala-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20223

[services.development]
run = "pnpm --filter @workspace/escala-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/escala-generator", "run", "build" ]
publicDir = "artifacts/escala-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20223"
BASE_PATH = "/"
